# Klipper test config: wraps the vulkan01 xyz-gripper Linux-MCU cfg and
# enables the extras required by stanless-steel-pin.gcode (and similar
# bench tests that cannot run G28 because the simulator has no endstops).
#
# Used by:  ./start.sh  (default cfg path)
#
# If your vulkan01 checkout lives elsewhere, override the include path:
#   ./start.sh /path/to/your/klipper-mcu.cfg
# or edit the [include] line below.

[include C:/Users/marc4/rust/vulkan01/config/klipper-mcu.cfg]

# SET_KINEMATIC_POSITION lets test G-code skip G28 when no real endstops
# are wired up (the simulator has none).
[force_move]
enable_force_move: True

# M118 / RESPOND emits messages back through the G-code channel so test
# scripts can log progress markers in their captured response stream.
[respond]
